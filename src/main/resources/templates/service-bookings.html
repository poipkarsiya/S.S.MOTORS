<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Service Bookings - S.S.MOTORS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .header {
            background: #111827;
            color: white;
            padding: 22px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            padding: 35px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 10px #ddd;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #eef2f7;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .pending {
            background: #fef3c7;
            color: #92400e;
        }

        .progress {
            background: #dbeafe;
            color: #1e40af;
        }

        .completed {
            background: #dcfce7;
            color: #166534;
        }

        .cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        .delete {
            color: #dc2626;
            text-decoration: none;
        }

        .empty {
            text-align: center;
            padding: 30px;
        }

    </style>

</head>

<body>

<div class="header">
    <h1>🔧 S.S.MOTORS</h1>

    <a href="/dashboard"
       style="background:#2563eb; color:white; padding:10px 16px;
              border-radius:6px; text-decoration:none;">
        ← Back to Dashboard
    </a>
</div>

<div class="container">

    <div class="top">

        <div>
            <h2>Service Bookings</h2>
            <p>Manage bike, scooter and auto-rickshaw servicing.</p>
        </div>

        <a href="/service-bookings/add" class="add-btn">
            + New Booking
        </a>

    </div>

    <table>

        <thead>

        <tr>
            <th>ID</th>
            <th>Vehicle</th>
            <th>Vehicle Type</th>
            <th>Service</th>
            <th>Booking Date</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="booking : ${bookings}">

            <td th:text="${booking.id}"></td>

            <td th:text="${booking.vehicle.vehicleNumber}"></td>

            <td th:text="${booking.vehicle.vehicleType}"></td>

            <td th:text="${booking.service.name}"></td>

            <td th:text="${booking.bookingDate}"></td>

            <td>

                <span
                    class="status"
                    th:classappend="${booking.status == 'PENDING' ? ' pending' :
                    booking.status == 'IN_PROGRESS' ? ' progress' :
                    booking.status == 'COMPLETED' ? ' completed' :
                    ' cancelled'}"

                    th:text="${booking.status}">
                </span>

            </td>

            <td th:text="${booking.priority}"></td>

            <td>

                <a
                    class="delete"
                    th:href="@{/service-bookings/delete/{id}(id=${booking.id})}"
                    onclick="return confirm('Delete this booking?')">

                    Delete

                </a>

            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(bookings)}">

            <td colspan="8" class="empty">
                No service bookings found.
            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
