
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Service Management</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 30px; }
        .container { max-width: 650px; margin: auto; background: white; padding: 25px; border-radius: 10px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, textarea, select { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 6px; }
        button, .back { display: inline-block; margin-top: 20px; padding: 10px 16px; cursor: pointer; }
        .error { background: #ffe5e5; color: #a00000; padding: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h2 th:text="${isEdit} ? 'Edit Service' : 'Add New Service'">Add New Service</h2>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <form th:action="@{/services/save}" th:object="${service}" method="post">
        <input type="hidden" th:field="*{id}">

        <label for="name">Service Name *</label>
        <input id="name" type="text" th:field="*{name}" required maxlength="255">

        <label for="description">Description</label>
        <textarea id="description" th:field="*{description}" rows="4"></textarea>

        <label for="estimatedHours">Estimated Hours</label>
        <input id="estimatedHours" type="number" th:field="*{estimatedHours}" min="0">

        <label for="basePrice">Base Price</label>
        <input id="basePrice" type="number" th:field="*{basePrice}" min="0" step="0.01">

        <label for="category">Category</label>
        <input id="category" type="text" th:field="*{category}" maxlength="100">

        <button type="submit">Save Service</button>
        <a class="back" th:href="@{/services}">Cancel / Back</a>
    </form>
</div>
</body>
</html>
