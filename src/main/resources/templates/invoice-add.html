<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Invoice - S.S.MOTORS</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f1f5f9; color: #172033; }
        header { background: #111827; color: white; padding: 22px 35px; }
        header h1 { margin: 0; }
        .card { max-width: 700px; margin: 35px auto; padding: 30px; background: white; border-radius: 10px; box-shadow: 0 3px 12px #ddd; }
        label { display: block; font-weight: bold; margin: 17px 0 7px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        button, .back { display: inline-block; margin-top: 22px; padding: 13px 18px; border: 0; border-radius: 6px; text-decoration: none; cursor: pointer; font-size: 15px; }
        button { background: #2563eb; color: white; width: 100%; }
        .back { background: #e2e8f0; color: #172033; text-align: center; width: 100%; margin-top: 10px; }
        .hint { color: #64748b; font-size: 13px; margin-top: 5px; }
        .total { margin-top: 20px; padding: 15px; border-radius: 6px; background: #eff6ff; font-size: 18px; font-weight: bold; }
        @media(max-width: 600px) { .card { margin: 15px; padding: 20px; } .grid { grid-template-columns: 1fr; gap: 0; } header { padding: 20px; } }
    </style>
</head>
<body>
<header>
    <h1>🔧 S.S.MOTORS</h1>
    <div>Billing &amp; Invoice Management</div>
</header>

<div class="card">
    <h2>Create Invoice</h2>
    <p class="hint">Choose a customer and enter the invoice amounts. Tax is added and discount is subtracted.</p>

    <form action="/invoices/save" method="post" id="invoiceForm">
        <label for="customerId">Customer *</label>
        <select id="customerId" name="customerId" required>
            <option value="">-- Select Customer --</option>
            <option th:each="customer : ${customers}"
                    th:value="${customer.id}"
                    th:text="${customer.fullName}"></option>
        </select>

        <label for="bookingId">Service Booking (optional)</label>
        <select id="bookingId" name="bookingId">
            <option value="">-- No linked booking --</option>
            <option th:each="booking : ${bookings}"
                    th:value="${booking.id}"
                    th:text="${'Booking #' + booking.id + ' - ' + booking.status}"></option>
        </select>
        <div class="hint">A booking can be linked to only one invoice.</div>

        <div class="grid">
            <div>
                <label for="totalAmount">Service / Parts Total (₹) *</label>
                <input type="number" id="totalAmount" name="totalAmount"
                       min="0" step="0.01" value="0.00" required>
            </div>
            <div>
                <label for="tax">Tax (₹)</label>
                <input type="number" id="tax" name="tax"
                       min="0" step="0.01" value="0.00" required>
            </div>
            <div>
                <label for="discount">Discount (₹)</label>
                <input type="number" id="discount" name="discount"
                       min="0" step="0.01" value="0.00" required>
            </div>
            <div>
                <label for="dueDate">Payment Due Date</label>
                <input type="date" id="dueDate" name="dueDate">
            </div>
        </div>

        <div class="total">Final Amount: ₹<span id="finalAmount">0.00</span></div>

        <button type="submit">Save Invoice</button>
        <a href="/invoices" class="back">← Back to Invoices</a>
    </form>
</div>

<script>
function calculateTotal() {
    const total = Number(document.getElementById('totalAmount').value || 0);
    const tax = Number(document.getElementById('tax').value || 0);
    const discount = Number(document.getElementById('discount').value || 0);
    document.getElementById('finalAmount').textContent =
        (total + tax - discount).toFixed(2);
}

['totalAmount', 'tax', 'discount'].forEach(id => {
    document.getElementById(id).addEventListener('input', calculateTotal);
});

document.getElementById('invoiceForm').addEventListener('submit', function(event) {
    const total = Number(document.getElementById('totalAmount').value || 0);
    const tax = Number(document.getElementById('tax').value || 0);
    const discount = Number(document.getElementById('discount').value || 0);

    if (total < 0 || tax < 0 || discount < 0 || total + tax < discount) {
        event.preventDefault();
        alert('Please check the amounts. The discount cannot exceed the total plus tax.');
    }
});

calculateTotal();
</script>
</body>
</html>
