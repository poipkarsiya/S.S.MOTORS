
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Service History - S.S.MOTORS</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 28px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,.08);
        }

        h2 { color: #173b72; margin-top: 0; }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccd2dc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea { resize: vertical; }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 22px;
        }

        button, .back {
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
        }

        button { background: #173b72; color: white; }
        .back { background: #e5e9f0; color: #222; }
    </style>
</head>

<body>
<div class="container">
    <h2>Add Service History</h2>

    <form th:action="@{/service-history/save}" method="post">

        <label for="vehicleId">Vehicle *</label>
        <select id="vehicleId" name="vehicleId" required>
            <option value="">Select Vehicle</option>
            <option th:each="v : ${vehicles}"
                    th:value="${v.id}"
                    th:text="${v.registrationNumber + ' - ' + v.model}">
            </option>
        </select>

        <label for="serviceDate">Service Date *</label>
        <input type="date" id="serviceDate" name="serviceDate" required>

        <label for="serviceType">Service Type</label>
        <input type="text" id="serviceType" name="serviceType"
               placeholder="e.g. Oil Change, General Service">

        <label for="cost">Service Cost (₹)</label>
        <input type="number" id="cost" name="cost"
               min="0" step="0.01" placeholder="Enter service cost">

        <label for="mechanicNotes">Mechanic Notes</label>
        <textarea id="mechanicNotes" name="mechanicNotes" rows="4"
                  placeholder="Enter diagnosis or work performed"></textarea>

        <label for="partsReplaced">Parts Replaced</label>
        <textarea id="partsReplaced" name="partsReplaced" rows="3"
                  placeholder="Enter replaced parts, if any"></textarea>

        <div class="buttons">
            <button type="submit">Save Service History</button>
            <a class="back" th:href="@{/service-history}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
