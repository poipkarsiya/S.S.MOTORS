<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>S.S.MOTORS | Edit Customer</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        .topbar {
            height: 72px;
            background: #101828;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            font-size: 30px;
        }

        .back {
            color: white;
            text-decoration: none;
            background: #2563eb;
            padding: 10px 18px;
            border-radius: 7px;
        }

        .container {
            max-width: 650px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d0d5dd;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

    </style>

</head>

<body>

<header class="topbar">

    <div class="brand">

        <span class="brand-icon">🔧</span>

        <strong>S.S.MOTORS</strong>

    </div>

    <a href="/customers" class="back">
        ← Customers
    </a>

</header>


<div class="container">

    <div class="card">

        <h2>Edit Customer</h2>

        <form action="/customers/update"
              method="post">

            <input type="hidden"
                   name="id"
                   th:value="${customer.id}">


            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    name="fullName"
                    th:value="${customer.fullName}"
                    required>

            </div>


            <div class="form-group">

                <label>Phone</label>

                <input
                    type="tel"
                    name="phone"
                    th:value="${customer.phone}"
                    required>

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    th:value="${customer.email}">

            </div>


            <div class="form-group">

                <label>Address</label>

                <textarea
                    name="address"
                    th:text="${customer.address}">
                </textarea>

            </div>


            <button type="submit">
                Update Customer
            </button>

        </form>

    </div>

</div>

</body>

</html>
