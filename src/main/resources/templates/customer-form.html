<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Customer - S.S.MOTORS">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .header {
            background: #111827;
            color: white;
            padding: 22px 40px;
        }

        .container {
            width: 600px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #ddd;
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: block;
            margin-top: 15px;
            text-align: center;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>S.S.MOTORS</h1>
</div>

<div class="container">

    <h2>Add Customer</h2>

    <form action="/customers/save" method="post">

        <label>Full Name *</label>
        <input
            type="text"
            name="fullName"
            placeholder="Enter full name"
            required>

        <label>Phone *</label>
        <input
            type="text"
            name="phone"
            placeholder="Enter phone number"
            required>

        <label>Email</label>
        <input
            type="email"
            name="email"
            placeholder="Enter email">

        <label>Address</label>
        <input
            type="text"
            name="address"
            placeholder="Enter address">

        <button type="submit">
            Save Customer
        </button>

    </form>

    <a href="/customers" class="back">
        ← Back to Customers
    </a>

</div>

</body>
</html>
