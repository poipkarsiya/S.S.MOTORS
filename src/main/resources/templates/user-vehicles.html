<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vehicles - S.S.MOTORS</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f3f5f9; color: #1f2937; }
        header { background: #182653; color: white; padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 24px; }
        main { max-width: 1100px; margin: 35px auto; padding: 0 18px; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 3px 12px #0000000d; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 13px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #eef2ff; }
        .button { display: inline-block; background: #2563eb; color: white; padding: 10px 15px; border-radius: 6px; text-decoration: none; }
        .empty { padding: 20px 0; color: #64748b; }
    </style>
</head>
<body>
<header>
    <h1>S.S.MOTORS — My Vehicles</h1>
    <a class="button" th:href="@{/user-home}">Back to Home</a>
</header>

<main>
    <section class="card">
        <h2>My Vehicles</h2>
        <p>Vehicles linked to your customer account.</p>

        <p class="empty" th:if="${#lists.isEmpty(vehicles)}">
            No vehicles are linked to your account yet. Please contact the garage administrator.
        </p>

        <table th:unless="${#lists.isEmpty(vehicles)}">
            <thead>
            <tr>
                <th>Registration Number</th>
                <th>Brand / Make</th>
                <th>Model</th>
                <th>Year</th>
                <th>Fuel Type</th>
                <th>Mileage</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="v : ${vehicles}">
                <td th:text="${v['registration_number']}"></td>
                <td th:text="${v['brand'] != null ? v['brand'] : v['make']}"></td>
                <td th:text="${v['model']}"></td>
                <td th:text="${v['vehicle_year'] != null ? v['vehicle_year'] : v['year']}"></td>
                <td th:text="${v['fuel_type']}"></td>
                <td th:text="${v['mileage']}"></td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
