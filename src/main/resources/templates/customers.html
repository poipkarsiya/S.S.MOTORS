<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>S.S.MOTORS | Customers</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #172033;
        }

        /* TOPBAR */

        .topbar {
            height: 72px;
            background: #101828;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 35px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            font-size: 30px;
        }

        .brand h1 {
            font-size: 23px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 7px;
            background: #2563eb;
        }

        /* PAGE */

        .container {
            padding: 35px;
            max-width: 1400px;
            margin: auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-header h2 {
            font-size: 28px;
        }

        .page-header p {
            color: #667085;
            margin-top: 6px;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 22px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        /* SEARCH */

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(16,24,40,0.07);
        }

        .search-box input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #2563eb;
        }

        /* TABLE */

        .table-container {
            background: white;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 3px 12px rgba(16,24,40,0.07);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8fafc;
            text-align: left;
            padding: 16px;
            font-size: 13px;
            color: #667085;
            text-transform: uppercase;
        }

        td {
            padding: 17px 16px;
            border-top: 1px solid #eaecf0;
        }

        .customer-name {
            font-weight: bold;
        }

        .phone {
            color: #475467;
        }

        .action-btn {
            text-decoration: none;
            padding: 7px 12px;
            border-radius: 6px;
            margin-right: 5px;
            font-size: 13px;
        }

        .edit {
            background: #eff6ff;
            color: #2563eb;
        }

        .delete {
            background: #fef2f2;
            color: #dc2626;
        }

        .empty {
            text-align: center;
            padding: 45px;
            color: #667085;
        }

        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);

            align-items: center;
            justify-content: center;
        }

        .modal-box {
            background: white;
            width: 500px;
            max-width: 92%;
            border-radius: 14px;
            padding: 30px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            font-size: 22px;
        }

        .close {
            font-size: 26px;
            cursor: pointer;
            color: #667085;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d0d5dd;
            border-radius: 7px;
            font-size: 15px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .save-btn {
            width: 100%;
            padding: 13px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        @media(max-width:700px) {

            .container {
                padding: 18px;
            }

            .page-header {
                align-items: flex-start;
                gap: 15px;
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

<!-- TOPBAR -->

<header class="topbar">

    <div class="brand">

        <div class="brand-icon">🔧</div>

        <h1>S.S.MOTORS</h1>

    </div>

    <a href="/dashboard" class="back-btn">
        ← Dashboard
    </a>

</header>


<!-- PAGE -->

<div class="container">

    <div class="page-header">

        <div>

            <h2>Customers</h2>

            <p>
                Manage your garage customers and their information.
            </p>

        </div>

        <button class="add-btn"
                onclick="openModal()">

            + Add Customer

        </button>

    </div>


    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search by name, phone or email..."
            onkeyup="searchCustomers()">

    </div>


    <!-- CUSTOMER TABLE -->

    <div class="table-container">

        <table>

            <thead>

            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Phone</th>

                <th>Email</th>

                <th>Address</th>

                <th>Actions</th>

            </tr>

            </thead>

            <tbody id="customerTable">

            <tr th:each="customer : ${customers}">

                <td th:text="${customer.id}">
                    1
                </td>

                <td class="customer-name"
                    th:text="${customer.fullName}">
                    Rahul
                </td>

                <td class="phone"
                    th:text="${customer.phone}">
                    9876543210
                </td>

                <td th:text="${customer.email}">
                    rahul@gmail.com
                </td>

                <td th:text="${customer.address}">
                    Mumbai
                </td>

                <td>

                    <a class="action-btn edit"
                       th:href="@{/customers/edit/{id}(id=${customer.id})}">
                        Edit
                    </a>

                    <a class="action-btn delete"
                       th:href="@{/customers/delete/{id}(id=${customer.id})}"
                       onclick="return confirm('Delete this customer?')">
                        Delete
                    </a>

                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(customers)}">

                <td colspan="6">

                    <div class="empty">

                        <div style="font-size:40px;">
                            👥
                        </div>

                        <h3>No customers yet</h3>

                        <p>
                            Click "Add Customer" to register your first customer.
                        </p>

                    </div>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>


<!-- ADD CUSTOMER MODAL -->

<div class="modal"
     id="customerModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>Add New Customer</h2>

            <span class="close"
                  onclick="closeModal()">
                ×
            </span>

        </div>

        <form action="/customers/add"
              method="post">

            <div class="form-group">

                <label>
                    Full Name *
                </label>

                <input
                    type="text"
                    name="fullName"
                    placeholder="Enter customer name"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Phone *
                </label>

                <input
                    type="tel"
                    name="phone"
                    placeholder="Enter phone number"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter email address">

            </div>


            <div class="form-group">

                <label>
                    Address
                </label>

                <textarea
                    name="address"
                    placeholder="Enter customer address">
                </textarea>

            </div>


            <button type="submit"
                    class="save-btn">

                Save Customer

            </button>

        </form>

    </div>

</div>


<script>

    function openModal() {
        document.getElementById("customerModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("customerModal").style.display = "none";
    }

    window.onclick = function(event) {

        const modal =
            document.getElementById("customerModal");

        if (event.target === modal) {
            closeModal();
        }

    };


    function searchCustomers() {

        const input =
            document.getElementById("searchInput")
            .value
            .toLowerCase();

        const rows =
            document.querySelectorAll("#customerTable tr");

        rows.forEach(function(row) {

            const text =
                row.innerText.toLowerCase();

            if (text.includes(input)) {
                row.style.display = "";
            } else {
                row.style.display = "none";
            }

        });

    }

</script>

</body>

</html>
